<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="A new Flutter project.">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="talento_digital">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>talento_digital</title>
  <link rel="manifest" href="manifest.json">
  <script>
    // Universal USB HID / Barcode / NFC scanner listener no navegador
    (function() {
      var rfidBuffer = '';
      var lastKeyTime = 0;
      window.addEventListener('keydown', function(e) {
        var now = Date.now();
        if (now - lastKeyTime > 600) {
          rfidBuffer = '';
        }
        lastKeyTime = now;

        if (e.key === 'Enter') {
          var code = rfidBuffer.trim();
          rfidBuffer = '';
          if (code.length >= 4 && /^[0-9a-fA-F]{4,32}$/.test(code)) {
            if (typeof window.onNfcTagScanned === 'function') {
              window.onNfcTagScanned(code.toUpperCase());
            }
          }
          return;
        }

        if (e.key && e.key.length === 1 && /[0-9a-fA-F]/.test(e.key)) {
          rfidBuffer += e.key;
        }
      }, true);

      // Garante que o canvas/visualizador do Flutter mantenha foco ao clicar/tocar
      window.addEventListener('pointerdown', function() {
        var el = document.querySelector('flutter-view') || document.querySelector('canvas');
        if (el && typeof el.focus === 'function') el.focus();
      });
    })();
  </script>
</head>
<body>
  <!--
    You can customize the "flutter_bootstrap.js" script.
    This is useful to provide a custom configuration to the Flutter loader
    or to give the user feedback during the initialization process.

    For more details:
    * https://docs.flutter.dev/platform-integration/web/initialization
  -->
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
